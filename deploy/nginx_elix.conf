# Site config for elix.vindhyatech.in only — does not touch any other
# server block on this VM. Installed as its own file in
# /etc/nginx/sites-available/, symlinked into sites-enabled/.
#
# Starts HTTP-only on purpose: `certbot --nginx -d elix.vindhyatech.in`
# (run by deploy.sh) edits this exact file in place to add the HTTPS
# server block + the HTTP->HTTPS redirect — that's certbot's normal
# workflow, not something this file does itself.

server {
    listen 80;
    listen [::]:80;
    server_name elix.vindhyatech.in;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/elix/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/elix.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
