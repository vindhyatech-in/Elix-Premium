{% comment %} djlint:off {% endcomment %}{% load allauth %}
<form
  method="{{ attrs.method }}"
  {% if attrs.action %}action="{{ attrs.action }}"{% endif %}
  class="auth-card__form"
  novalidate
>
  {% slot body %}{% endslot %}
  <div class="auth-card__form-actions">
    {% slot actions %}{% endslot %}
  </div>
</form>
