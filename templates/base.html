{% load static %}<!doctype html>
<html lang="en-IN">
<head>
  {% include 'partials/meta.html' %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body id="top">
  <a href="#main-content" class="skip-link">Skip to content</a>

  {% include 'partials/preloader.html' %}
  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  {% include 'partials/navbar.html' %}

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/footer.html' %}
  {% include 'partials/schema.html' %}

  <!-- Vendor libraries (CDN — no build step required) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
  <!--
    Optional, not loaded by default (keeps payload lean):
    Lottie   -> https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js
    Three.js -> https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js
    Add either only if a section needs a real .json/.glb asset — see developed.md.
  -->

  <script src="{% static 'js/main.js' %}" defer></script>
  <script src="{% static 'js/animations.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
