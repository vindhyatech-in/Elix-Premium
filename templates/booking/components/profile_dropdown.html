<div class="app-navbar__dropdown-panel" id="profile-panel" data-dropdown-panel role="menu" aria-label="Profile menu">
  {% if user.is_authenticated %}
    <div class="dropdown-panel__header">
      <strong>{{ user.email }}</strong>
      <span>Signed in</span>
    </div>
    <a href="{% url 'profile' %}" class="app-navbar__dropdown-item" role="menuitem">Profile</a>
    <a href="{% url 'bookings_dashboard' %}" class="app-navbar__dropdown-item" role="menuitem">Bookings</a>
    <a href="{% url 'profile' %}#addresses" class="app-navbar__dropdown-item" role="menuitem">Addresses</a>
    <button type="button" class="app-navbar__dropdown-item" data-coming-soon="Notifications settings" role="menuitem">Notification Settings</button>
    <button type="button" class="app-navbar__dropdown-item" data-coming-soon="Support" role="menuitem">Support</button>
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{% url 'services_booking' %}">
      <button type="submit" class="app-navbar__dropdown-item" role="menuitem">Logout</button>
    </form>
  {% else %}
    <div class="dropdown-panel__header">
      <strong>Welcome</strong>
      <span>Sign in to sync your bookings</span>
    </div>
    <a href="{% url 'account_login' %}?next={{ request.path }}" class="app-navbar__dropdown-item" role="menuitem">Sign In</a>
    <a href="{% url 'account_signup' %}?next={{ request.path }}" class="app-navbar__dropdown-item" role="menuitem">Create Account</a>
    <button type="button" class="app-navbar__dropdown-item" data-coming-soon="Support" role="menuitem">Support</button>
  {% endif %}
</div>
