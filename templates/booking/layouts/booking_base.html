{% load static %}<!doctype html>
<html lang="en-IN">
<head>
  <script>
    // Same no-flash theme technique as the marketing base.html — the app
    // shares the same design tokens/dark-mode preference, so it must not
    // flash the wrong theme either. See developed.md "Dark mode / theming".
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16120f">
  <title>{% block title %}Book a Service — {{ SITE.name }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Browse and book verified home beauty services and packages on {{ SITE.name }} — hair, skin, makeup, nails and spa, delivered to your door.{% endblock %}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="{{ request.build_absolute_uri }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ SITE.name }}">
  <meta property="og:title" content="Book a Service — {{ SITE.name }}">
  <meta property="og:description" content="Browse and book verified home beauty services and packages, delivered to your door.">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta property="og:image" content="{% static 'images/og-cover.svg' %}">
  <meta property="og:locale" content="en_IN">

  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js@10/public/assets/styles/choices.min.css">
  <!-- Leaflet + OpenStreetMap tiles — free, no API key required (unlike
       Google Maps JS API). Powers the booking drawer's address-map step.
       See developed.md "Service Booking App" for why. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/booking.css' %}">
</head>
<body id="top" class="booking-app" data-static-url="{% static '' %}" data-authenticated="{{ user.is_authenticated|yesno:'true,false' }}" data-login-url="{% url 'account_login' %}">
  <a href="#catalog" class="skip-link">Skip to services</a>

  {% block content %}{% endblock %}

  {% include 'partials/schema.html' %}

  <!-- Vendor libraries (CDN — no build step required, matches the marketing site) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/choices.js@10/public/assets/scripts/choices.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="{% static 'js/main.js' %}" defer></script>
  <script src="{% static 'js/booking.js' %}" defer></script>
  <script src="{% static 'js/booking_drawer.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
