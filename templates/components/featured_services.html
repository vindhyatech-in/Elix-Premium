{% load static %}
<section class="services section" id="services" aria-labelledby="services-title">
  <div class="container">
    <div class="section-head section-head--center" data-aos="fade-up">
      <p class="eyebrow">Service Categories</p>
      <h2 class="section-title" id="services-title">Explore by <em>Category</em></h2>
      <p class="section-lead">Select a category to view all specialized services and book your at-home salon appointment.</p>
    </div>

    <div class="category-cards-grid">
      {% for cat in categories %}
        <a href="{% url 'services_booking' %}?category={{ cat.slug }}" class="category-card" data-aos="fade-up" data-aos-delay="{{ forloop.counter0|add:'0' }}00">
          <div class="category-card__media">
            <img src="{{ cat.photo_url }}" alt="{{ cat.name }}" loading="lazy">
            <span class="category-card__count">{{ cat.services_count }} Services</span>
          </div>
          <div class="category-card__body">
            <h3 class="category-card__title">{{ cat.name }}</h3>
            <p class="category-card__desc">{{ cat.description }}</p>
            <span class="category-card__cta">
              Explore Services
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </span>
          </div>
        </a>
      {% endfor %}
    </div>
  </div>
</section>
