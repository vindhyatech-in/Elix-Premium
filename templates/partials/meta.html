{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120f">
<title>{% block title %}{{ SITE.name }} — Luxury Beauty Services At Your Doorstep{% endblock %}</title>
<meta name="description" content="{% block meta_description %}{{ SITE.description }}{% endblock %}">
<meta name="keywords" content="at home salon, home beauty service, on-demand beautician, bridal makeup at home, home spa, {{ SITE.name }}">
<meta name="author" content="{{ SITE.name }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="{{ request.build_absolute_uri }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ SITE.name }}">
<meta property="og:title" content="{% block og_title %}{{ SITE.name }} — Luxury Beauty, At Your Doorstep{% endblock %}">
<meta property="og:description" content="{{ SITE.description }}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:image" content="{% static 'images/og-cover.svg' %}">
<meta property="og:locale" content="en_IN">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ SITE.name }} — Luxury Beauty, At Your Doorstep">
<meta name="twitter:description" content="{{ SITE.description }}">
<meta name="twitter:image" content="{% static 'images/og-cover.svg' %}">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">

<!-- Preconnects for third-party font/animation CDNs -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">

<!-- Typography: Fraunces (editorial display serif) + Inter (body) -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
